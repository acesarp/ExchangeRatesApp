trigger:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.Name -equals DELLServ

steps:
- checkout: self
  clean: true

- powershell: |
    whoami
    whoami /groups
    docker version
    docker info
    docker compose version
  displayName: 'Verify Docker'

- powershell: |
    docker compose `
      -f docker/docker-compose.yml `
      build
  displayName: 'Build ExchangeRates'

- powershell: |
    $env:EXCHANGERATES_CONNECTION_STRING = "$(EXCHANGERATES_CONNECTION_STRING)"

- powershell: |
    docker compose `
      -f docker/docker-compose.yml `
      up -d --remove-orphans
  displayName: 'Deploy ExchangeRates'

- powershell: |
    $env:EXCHANGERATES_CONNECTION_STRING = "$(EXCHANGERATES_CONNECTION_STRING)"

- powershell: |
    docker compose `
      -f docker/docker-compose.yml `
      ps
  displayName: 'Verify Deployment'

- powershell: |
    docker image prune -f
  displayName: 'Clean old images'