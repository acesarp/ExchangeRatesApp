trigger:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.Name -equals DELLServ

steps:
- checkout: self
  clean: true

- powershell: |
    $providerKeysPath = "$(Build.SourcesDirectory)\providerkeys.json"
    $env:PROVIDER_KEYS_JSON | Set-Content -Path $providerKeysPath -Encoding UTF8

    if (-not (Test-Path $providerKeysPath)) { throw "providerkeys.json was not created." }
    Write-Host "providerkeys.json created successfully."
  env:
    PROVIDER_KEYS_JSON: $(PROVIDER_KEYS_JSON)
  displayName: 'Create Provider Keys 🔑'

- powershell: |
    whoami
    whoami /groups
    docker version
    docker info
    docker compose version
  displayName: 'Verify Docker 🔎'

- powershell: |
    docker compose `
      -f docker/docker-compose.yml `
      build
    $env:EXCHANGERATES_CONNECTION_STRING = "$(EXCHANGERATES_CONNECTION_STRING)"
  displayName: 'Build ExchangeRates 🛠️'

- powershell: |
    docker compose `
      -f docker/docker-compose.yml `
      up -d --remove-orphans
    $env:EXCHANGERATES_CONNECTION_STRING = "$(EXCHANGERATES_CONNECTION_STRING)"
  displayName: 'Deploy ExchangeRates 🚀'

- powershell: |
    docker compose `
      -f docker/docker-compose.yml `
      ps
  displayName: 'Verify Deployment 👀'

- powershell: |
    docker image prune -f
  displayName: 'Clean old images 🧹'