name: CI

# Builds and tests the app on every push and pull request.
# Deployment is done by the Azure DevOps pipeline (azure/main.yml), not here.

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Program.cs requires providerkeys.json. The real keys are never in the repo, and the
      # tests that call real central bank APIs are excluded by default.runsettings.
      - name: Create empty provider keys
        run: |
          echo '{ "ProviderKeys": {} }' > Server/ExchangeRates.Server/providerkeys.json
      - name: Restore
        run: dotnet restore Server/ExchangeRates.Server.slnx

      - name: Build
        run: dotnet build Server/ExchangeRates.Server.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Server/ExchangeRates.Server.slnx --no-build --configuration Release --settings Server/ExchangeRates.Server.Tests/default.runsettings

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.Server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/acesarp/exchangerates-server:latest
            ghcr.io/acesarp/exchangerates-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.Client
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/acesarp/exchangerates-client:latest
            ghcr.io/acesarp/exchangerates-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
