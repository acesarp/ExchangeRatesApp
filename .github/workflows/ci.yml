name: Deploy Docker Image

# Builds and tests the app on every push and pull request.
# Deployment is done by the Azure DevOps pipeline (azure/main.yml), not here.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: acesarp/exchangeratesapps

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/acesarp/exchangeratesapps:latest
            ghcr.io/acesarp/exchangeratesapps:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: self-hosted

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.Client
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/acesarp/exchangerates-client:latest
            ghcr.io/acesarp/exchangerates-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
