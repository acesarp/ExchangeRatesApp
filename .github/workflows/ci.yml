name: Deploy Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: acesarp/exchangeratesapps

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/acesarp/exchangeratesapps:latest
            ghcr.io/acesarp/exchangeratesapps:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: self-hosted

    steps:
      - name: Pull image
        run: docker pull ghcr.io/acesarp/exchangeratesapps:${{ github.sha }}

      - name: Replace container
        run: |
          docker stop exchangerates || true
          docker rm exchangerates || true
          docker run -d --restart unless-stopped --name exchangerates ghcr.io/acesarp/exchangeratesapps:${{ github.sha }}